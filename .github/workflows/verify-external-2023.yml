name: Verify Turkey-Syria 2023 external results

on:
  push:
    branches: [main, add-2026-turkey-syria-external-validation]
    paths:
      - 'results/external_turkey_syria_2023/**'
      - 'scripts/verify_turkey2023_external.py'
      - '.github/workflows/verify-external-2023.yml'
  pull_request:
    paths:
      - 'results/external_turkey_syria_2023/**'
      - 'scripts/verify_turkey2023_external.py'
      - '.github/workflows/verify-external-2023.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-supplement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-ci.txt
      - name: Install saved-results verification environment
        run: python -m pip install -r requirements-ci.txt
      - name: Verify saved external results and SHA-256 inventory
        run: python scripts/verify_turkey2023_external.py
